<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Firma Paneli - e-Firmam</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/Pz11x68W/f-1.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --ana-renk: #0f172a;
            --vurgu-renk: #f97316;
            --acik-renk: #f8fafc;
            --beyaz: #ffffff;
            --koyu: #1e293b;
            --gri: #64748b;
            --acik-gri: #e2e8f0;
            --gradient: linear-gradient(135deg, #f97316, #ea580c);
            --yesil: #10b981;
            --kirmizi: #ef4444;
            --sari: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--acik-renk);
            color: var(--koyu);
            line-height: 1.6;
        }

        .ust-menu {
            background: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .menu-icerik {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid var(--vurgu-renk);
        }

        .logo-ad {
            color: var(--beyaz);
            font-size: 20px;
            font-weight: 800;
        }

        .logo-ad span {
            color: var(--vurgu-renk);
        }

        .cikis-btn {
            background: rgba(239,68,68,0.2);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        .panel-konteyner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .panel-baslik {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel-baslik h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--ana-renk);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .panel-baslik h1 img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--vurgu-renk);
        }

        .sekmeler {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: var(--beyaz);
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .sekme-btn {
            padding: 12px 25px;
            border: none;
            background: none;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--gri);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .sekme-btn:hover {
            background: var(--acik-renk);
        }

        .sekme-btn.aktif {
            background: var(--gradient);
            color: var(--beyaz);
            box-shadow: 0 5px 15px rgba(249,115,22,0.3);
        }

        .sekme-icerik {
            display: none;
            background: var(--beyaz);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .sekme-icerik.aktif {
            display: block;
        }

        .istatistik-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .istatistik-kart {
            background: var(--acik-renk);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        .istatistik-ikon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 22px;
        }

        .istatistik-sayi {
            font-size: 28px;
            font-weight: 800;
            color: var(--ana-renk);
        }

        .istatistik-etiket {
            font-size: 13px;
            color: var(--gri);
            margin-top: 5px;
        }

        .ikon-turuncu { background: rgba(249,115,22,0.15); color: var(--vurgu-renk); }
        .ikon-yesil { background: rgba(16,185,129,0.15); color: var(--yesil); }
        .ikon-mavi { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .ikon-sari { background: rgba(245,158,11,0.15); color: var(--sari); }

        .yorum-item {
            background: var(--acik-renk);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
        }

        .yorum-sol {
            flex: 1;
            min-width: 200px;
        }

        .yorum-yazar {
            font-weight: 600;
            font-size: 14px;
            color: var(--ana-renk);
        }

        .yorum-puan {
            color: var(--sari);
            font-size: 14px;
            margin: 5px 0;
        }

        .yorum-metin {
            font-size: 14px;
        }

        .yorum-tarih {
            font-size: 12px;
            color: var(--gri);
            margin-top: 5px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-itiraz {
            background: rgba(239,68,68,0.1);
            color: var(--kirmizi);
            border: 1px solid rgba(239,68,68,0.3);
        }

        .itiraz-item {
            background: var(--acik-renk);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .itiraz-durum {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }

        .durum-beklemede { background: rgba(245,158,11,0.15); color: #d97706; }
        .durum-onaylandi { background: rgba(16,185,129,0.15); color: #065f46; }
        .durum-reddedildi { background: rgba(239,68,68,0.15); color: #991b1b; }

        .form-grup {
            margin-bottom: 20px;
        }

        .form-grup label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-grup input,
        .form-grup select,
        .form-grup textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--acik-gri);
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .form-grup input:focus,
        .form-grup select:focus,
        .form-grup textarea:focus {
            border-color: var(--vurgu-renk);
        }

        .form-satir {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .kaydet-btn {
            background: var(--gradient);
            color: var(--beyaz);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        .bildirim {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .bildirim.hata {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }

        .bildirim.basarili {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--acik-gri);
            border-top: 5px solid var(--vurgu-renk);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.acik {
            display: flex;
        }

        .modal-icerik {
            background: var(--beyaz);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-baslik {
            font-size: 20px;
            font-weight: 700;
            color: var(--ana-renk);
            margin-bottom: 20px;
        }

        .modal-kapat {
            float: right;
            cursor: pointer;
            font-size: 24px;
            color: var(--gri);
            background: none;
            border: none;
        }

        @media (max-width: 768px) {
            .sekme-btn {
                padding: 10px 15px;
                font-size: 12px;
            }

            .sekme-icerik {
                padding: 20px;
            }

            .form-satir {
                grid-template-columns: 1fr;
            }

            .panel-baslik h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <nav class="ust-menu">
        <div class="menu-icerik">
            <a href="../index.html" class="logo">
                <img src="https://i.ibb.co/Pz11x68W/f-1.png" alt="Logo">
                <span class="logo-ad">e-<span>Firmam</span> Panel</span>
            </a>
            <button class="cikis-btn" onclick="cikisYap()">
                <i class="fas fa-sign-out-alt"></i> Çıkış
            </button>
        </div>
    </nav>

    <div class="panel-konteyner">
        <div id="bildirim" class="bildirim"></div>

        <div class="panel-baslik">
            <h1>
                <img src="https://i.ibb.co/Pz11x68W/f-1.png" alt="Firma Logo" id="firmaLogoBaslik">
                <span id="firmaAdiBaslik">Yükleniyor...</span>
            </h1>
        </div>

        <div class="sekmeler">
            <button class="sekme-btn aktif" onclick="sekmeDegistir('genel')"><i class="fas fa-home"></i> Genel Bakış</button>
            <button class="sekme-btn" onclick="sekmeDegistir('istatistik')"><i class="fas fa-chart-bar"></i> İstatistikler</button>
            <button class="sekme-btn" onclick="sekmeDegistir('yorumlar')"><i class="fas fa-comments"></i> Yorumlar</button>
            <button class="sekme-btn" onclick="sekmeDegistir('itirazlar')"><i class="fas fa-flag"></i> İtirazlarım</button>
            <button class="sekme-btn" onclick="sekmeDegistir('duzenle')"><i class="fas fa-edit"></i> Firma Düzenle</button>
        </div>

        <div class="sekme-icerik aktif" id="sekme-genel">
            <div class="istatistik-grid" id="genelIstatistik">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>

        <div class="sekme-icerik" id="sekme-istatistik">
            <h3 style="margin-bottom: 20px; color: var(--ana-renk);"><i class="fas fa-chart-line" style="color: var(--vurgu-renk);"></i> İstatistikler</h3>
            <div class="grafik-konteyner"><canvas id="grafikCanvas"></canvas></div>
            <div class="istatistik-grid" id="istatistikDetay" style="margin-top: 30px;"></div>
        </div>

        <div class="sekme-icerik" id="sekme-yorumlar">
            <h3 style="margin-bottom: 20px; color: var(--ana-renk);"><i class="fas fa-comments" style="color: var(--vurgu-renk);"></i> Gelen Yorumlar</h3>
            <div id="yorumListesi"><div class="loading"><div class="spinner"></div></div></div>
        </div>

        <div class="sekme-icerik" id="sekme-itirazlar">
            <h3 style="margin-bottom: 20px; color: var(--ana-renk);"><i class="fas fa-flag" style="color: var(--vurgu-renk);"></i> İtirazlarım</h3>
            <div id="itirazListesi"><div class="loading"><div class="spinner"></div></div></div>
        </div>

        <div class="sekme-icerik" id="sekme-duzenle">
            <h3 style="margin-bottom: 20px; color: var(--ana-renk);"><i class="fas fa-edit" style="color: var(--vurgu-renk);"></i> Firma Bilgilerini Düzenle</h3>
            <div id="duzenleForm"><div class="loading"><div class="spinner"></div></div></div>
        </div>
    </div>

    <div class="modal" id="itirazModal">
        <div class="modal-icerik">
            <button class="modal-kapat" onclick="modalKapat()">&times;</button>
            <h3 class="modal-baslik">Yorum İtirazı</h3>
            <div class="form-grup">
                <label>İtiraz Sebebi</label>
                <select id="itirazSebebi">
                    <option value="Sahte yorum">Sahte yorum</option>
                    <option value="Hakaret / Küfür">Hakaret / Küfür</option>
                    <option value="Reklam / Spam">Reklam / Spam</option>
                    <option value="Yanlış firmaya yazılmış">Yanlış firmaya yazılmış</option>
                    <option value="Kişisel bilgi ifşa">Kişisel bilgi ifşa</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>
            <div class="form-grup">
                <label>Açıklama (Opsiyonel)</label>
                <textarea id="itirazAciklama" style="min-height: 80px;" placeholder="İtirazınızı açıklayın..."></textarea>
            </div>
            <button class="kaydet-btn" onclick="itirazGonder()"><i class="fas fa-paper-plane"></i> İtirazı Gönder</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjFIiPpycaCru8qh6hbUudVswkr1dkLOI",
            authDomain: "efirmam-45ddf.firebaseapp.com",
            projectId: "efirmam-45ddf",
            storageBucket: "efirmam-45ddf.firebasestorage.app",
            messagingSenderId: "206457982134",
            appId: "1:206457982134:web:a6b244b3f1aae10129aa17",
            measurementId: "G-NCVWRTP072"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let mevcutKullanici = null;
        let mevcutFirma = null;
        let mevcutFirmaId = null;
        let itirazYorumId = null;
        let duzLogoDosya = null;
        let grafik = null;

        function sekmeDegistir(sekme) {
            document.querySelectorAll('.sekme-btn').forEach(btn => btn.classList.remove('aktif'));
            document.querySelectorAll('.sekme-icerik').forEach(icerik => icerik.classList.remove('aktif'));
            document.getElementById('sekme-' + sekme).classList.add('aktif');
            event.target.classList.add('aktif');
            
            if (sekme === 'istatistik') istatistikYukle();
            if (sekme === 'yorumlar') yorumlariYukle();
            if (sekme === 'itirazlar') itirazlariYukle();
            if (sekme === 'duzenle') duzenleFormYukle();
        }

        function modalAc(yorumId) {
            itirazYorumId = yorumId;
            document.getElementById('itirazModal').classList.add('acik');
        }

        function modalKapat() {
            document.getElementById('itirazModal').classList.remove('acik');
        }

        function bildirimGoster(mesaj, tip) {
            const bildirim = document.getElementById('bildirim');
            bildirim.textContent = mesaj;
            bildirim.className = 'bildirim ' + tip;
            setTimeout(() => bildirim.className = 'bildirim', 5000);
        }

        function cikisYap() {
            auth.signOut().then(() => {
                window.location.href = '../firma-giris.html';
            });
        }

        async function firmaBilgiYukle() {
            try {
                const firmaSnapshot = await db.collection('firmalar')
                    .where('kullanici_id', '==', mevcutKullanici.uid)
                    .limit(1)
                    .get();
                
                if (!firmaSnapshot.empty) {
                    const doc = firmaSnapshot.docs[0];
                    mevcutFirma = doc.data();
                    mevcutFirmaId = doc.id;
                    
                    document.getElementById('firmaAdiBaslik').textContent = mevcutFirma.firma_adi;
                    
                    if (mevcutFirma.logo_url) {
                        document.getElementById('firmaLogoBaslik').src = mevcutFirma.logo_url;
                    }
                    
                    genelBakisiYukle();
                }
            } catch (error) {
                console.error('Firma bilgi hatası:', error);
            }
        }

        function genelBakisiYukle() {
            const genelIstatistik = document.getElementById('genelIstatistik');
            
            genelIstatistik.innerHTML = `
                <div class="istatistik-kart">
                    <div class="istatistik-ikon ikon-turuncu"><i class="fas fa-eye"></i></div>
                    <div class="istatistik-sayi">${mevcutFirma.goruntulenme || 0}</div>
                    <div class="istatistik-etiket">Görüntülenme</div>
                </div>
                <div class="istatistik-kart">
                    <div class="istatistik-ikon ikon-yesil"><i class="fas fa-phone"></i></div>
                    <div class="istatistik-sayi">${mevcutFirma.telefon_tiklama || 0}</div>
                    <div class="istatistik-etiket">Telefon Tıklama</div>
                </div>
                <div class="istatistik-kart">
                    <div class="istatistik-ikon ikon-mavi"><i class="fab fa-whatsapp"></i></div>
                    <div class="istatistik-sayi">${mevcutFirma.whatsapp_tiklama || 0}</div>
                    <div class="istatistik-etiket">WhatsApp Tıklama</div>
                </div>
                <div class="istatistik-kart">
                    <div class="istatistik-ikon ikon-sari"><i class="fas fa-comments"></i></div>
                    <div class="istatistik-sayi">${mevcutFirma.yorum_sayisi || 0}</div>
                    <div class="istatistik-etiket">Yorum</div>
                </div>
            `;
        }

        function istatistikYukle() {
            const istatistikDetay = document.getElementById('istatistikDetay');
            
            istatistikDetay.innerHTML = `
                <div class="istatistik-kart">
                    <div class="istatistik-ikon ikon-turuncu"><i class="fas fa-eye"></i></div>
                    <div class="istatistik-sayi">${mevcutFirma.goruntulenme || 0}</div>
                    <div class="istatistik-etiket">Toplam Görüntülenme</div>
                </div>
                <div class="istatistik-kart">
                    <div class="istatistik-ikon ikon-yesil"><i class="fas fa-phone"></i></div>
                    <div class="istatistik-sayi">${mevcutFirma.telefon_tiklama || 0}</div>
                    <div class="istatistik-etiket">Telefon Tıklama</div>
                </div>
                <div class="istatistik-kart">
                    <div class="istatistik-ikon ikon-mavi"><i class="fab fa-whatsapp"></i></div>
                    <div class="istatistik-sayi">${mevcutFirma.whatsapp_tiklama || 0}</div>
                    <div class="istatistik-etiket">WhatsApp Tıklama</div>
                </div>
                <div class="istatistik-kart">
                    <div class="istatistik-ikon ikon-sari"><i class="fas fa-star"></i></div>
                    <div class="istatistik-sayi">${mevcutFirma.ortalama_puan || 0}</div>
                    <div class="istatistik-etiket">Ortalama Puan</div>
                </div>
            `;
            
            // Eski grafiği temizle
            if (grafik) {
                grafik.destroy();
            }
            
            const ctx = document.getElementById('grafikCanvas').getContext('2d');
            
            grafik = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Görüntülenme', 'Telefon', 'WhatsApp', 'Web Tıklama'],
                    datasets: [{
                        label: 'İstatistikler',
                        data: [
                            mevcutFirma.goruntulenme || 0,
                            mevcutFirma.telefon_tiklama || 0,
                            mevcutFirma.whatsapp_tiklama || 0,
                            mevcutFirma.web_tiklama || 0
                        ],
                        backgroundColor: ['#f97316', '#10b981', '#3b82f6', '#f59e0b'],
                        borderRadius: 10
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        async function yorumlariYukle() {
            const yorumListesi = document.getElementById('yorumListesi');
            
            try {
                const snapshot = await db.collection('yorumlar')
                    .where('firma_id', '==', mevcutFirmaId)
                    .get();
                
                if (snapshot.empty) {
                    yorumListesi.innerHTML = '<p style="text-align: center; color: var(--gri);">Henüz yorum yapılmamış.</p>';
                    return;
                }
                
                yorumListesi.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    
                    if (data.durum === 'kaldirildi') return;
                    
                    const yorumItem = document.createElement('div');
                    yorumItem.className = 'yorum-item';
                    
                    let yildizlar = '';
                    for (let i = 0; i < 5; i++) {
                        yildizlar += i < (data.puan || 0) ? '★' : '☆';
                    }
                    
                    yorumItem.innerHTML = `
                        <div class="yorum-sol">
                            <div class="yorum-yazar">${data.yorumcu_adi || 'Anonim'}</div>
                            <div class="yorum-puan">${yildizlar}</div>
                            <div class="yorum-metin">${data.yorum}</div>
                            <div class="yorum-tarih">${data.tarih ? new Date(data.tarih.toDate()).toLocaleDateString('tr-TR') : ''}</div>
                        </div>
                        <div class="yorum-aksiyonlar">
                            <button class="btn btn-itiraz" onclick="modalAc('${doc.id}')"><i class="fas fa-flag"></i> İtiraz Et</button>
                        </div>
                    `;
                    
                    yorumListesi.appendChild(yorumItem);
                });
            } catch (error) {
                console.error('Yorum yükleme hatası:', error);
                yorumListesi.innerHTML = '<p style="text-align: center; color: var(--gri);">Henüz yorum yapılmamış.</p>';
            }
        }

        async function itirazlariYukle() {
            const itirazListesi = document.getElementById('itirazListesi');
            
            try {
                const snapshot = await db.collection('itirazlar')
                    .where('firma_id', '==', mevcutFirmaId)
                    .get();
                
                if (snapshot.empty) {
                    itirazListesi.innerHTML = '<p style="text-align: center; color: var(--gri);">Henüz itiraz yapılmamış.</p>';
                    return;
                }
                
                itirazListesi.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const itirazItem = document.createElement('div');
                    itirazItem.className = 'itiraz-item';
                    
                    let durumClass = 'durum-beklemede';
                    let durumText = 'Beklemede';
                    
                    if (data.durum === 'onaylandi') {
                        durumClass = 'durum-onaylandi';
                        durumText = 'Onaylandı - Yorum Kaldırıldı';
                    } else if (data.durum === 'reddedildi') {
                        durumClass = 'durum-reddedildi';
                        durumText = 'Reddedildi - Yorum Kaldı';
                    }
                    
                    itirazItem.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;">
                            <strong>${data.itiraz_sebebi}</strong>
                            <span class="itiraz-durum ${durumClass}">${durumText}</span>
                        </div>
                        ${data.aciklama ? `<p style="font-size: 14px; color: var(--gri); margin-bottom: 10px;">${data.aciklama}</p>` : ''}
                        <small style="color: var(--gri);">${data.tarih ? new Date(data.tarih.toDate()).toLocaleDateString('tr-TR') : ''}</small>
                    `;
                    
                    itirazListesi.appendChild(itirazItem);
                });
            } catch (error) {
                console.error('İtiraz yükleme hatası:', error);
                itirazListesi.innerHTML = '<p style="text-align: center; color: var(--gri);">Henüz itiraz yapılmamış.</p>';
            }
        }

        async function itirazGonder() {
            const sebep = document.getElementById('itirazSebebi').value;
            const aciklama = document.getElementById('itirazAciklama').value.trim();
            
            if (!itirazYorumId) {
                bildirimGoster('İtiraz edilecek yorum bulunamadı.', 'hata');
                return;
            }
            
            try {
                await db.collection('itirazlar').add({
                    yorum_id: itirazYorumId,
                    firma_id: mevcutFirmaId,
                    itiraz_sebebi: sebep,
                    aciklama: aciklama,
                    durum: 'beklemede',
                    tarih: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                bildirimGoster('İtirazınız admin\'e gönderildi.', 'basarili');
                modalKapat();
                document.getElementById('itirazAciklama').value = '';
            } catch (error) {
                console.error('İtiraz hatası:', error);
                bildirimGoster('İtiraz gönderilirken hata oluştu.', 'hata');
            }
        }

        function duzenleFormYukle() {
            const duzenleForm = document.getElementById('duzenleForm');
            const sm = mevcutFirma.sosyal_medya || {};
            const logoHtml = mevcutFirma.logo_url 
                ? `<img src="${mevcutFirma.logo_url}" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">` 
                : '<i class="fas fa-building"></i>';
            
            duzenleForm.innerHTML = `
                <div class="form-grup">
                    <label>Firma Logosu</label>
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 10px; flex-wrap: wrap;">
                        <div id="duzLogoOnizleme" style="width: 100px; height: 100px; border-radius: 15px; border: 2px dashed var(--acik-gri); display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--acik-renk); font-size: 40px; color: var(--acik-gri);">
                            ${logoHtml}
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <button class="btn" style="background: var(--gradient); color: white; border: none;" onclick="document.getElementById('duzLogoInput').click()">
                                <i class="fas fa-upload"></i> Logo Değiştir
                            </button>
                            ${mevcutFirma.logo_url ? `
                            <button class="btn btn-itiraz" onclick="logoSil()">
                                <i class="fas fa-trash"></i> Logo Sil
                            </button>` : ''}
                        </div>
                        <input type="file" id="duzLogoInput" accept="image/*" style="display: none;" onchange="duzLogoOnizle(this)">
                    </div>
                </div>
                
                <div class="form-grup">
                    <label>Firma Adı</label>
                    <input type="text" id="duzFirmaAdi" value="${mevcutFirma.firma_adi || ''}">
                </div>
                
                <div class="form-satir">
                    <div class="form-grup">
                        <label>Telefon</label>
                        <input type="tel" id="duzTelefon" value="${mevcutFirma.telefon || ''}">
                    </div>
                    <div class="form-grup">
                        <label>E-posta</label>
                        <input type="email" id="duzEmail" value="${mevcutFirma.email || ''}">
                    </div>
                </div>
                
                <div class="form-grup">
                    <label>Açıklama</label>
                    <textarea id="duzAciklama" style="min-height: 80px;">${mevcutFirma.aciklama || ''}</textarea>
                </div>
                
                <div class="form-satir">
                    <div class="form-grup">
                        <label>İl</label>
                        <select id="duzIl" onchange="duzIlceleriYukle()">
                            <option value="">İl Seçin</option>
                        </select>
                    </div>
                    <div class="form-grup">
                        <label>İlçe</label>
                        <select id="duzIlce">
                            <option value="">İlçe Seçin</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-grup">
                    <label>Adres</label>
                    <textarea id="duzAdres" style="min-height: 60px;">${mevcutFirma.adres || ''}</textarea>
                </div>
                
                <div class="form-grup">
                    <label>Web Sitesi</label>
                    <input type="url" id="duzWeb" value="${mevcutFirma.web_sitesi || ''}">
                </div>
                
                <div class="form-grup">
                    <label>Sosyal Medya</label>
                    <div class="form-satir">
                        <div class="form-grup">
                            <label style="font-size: 12px;">Facebook</label>
                            <input type="url" id="duzFacebook" value="${sm.facebook || ''}">
                        </div>
                        <div class="form-grup">
                            <label style="font-size: 12px;">Instagram</label>
                            <input type="url" id="duzInstagram" value="${sm.instagram || ''}">
                        </div>
                        <div class="form-grup">
                            <label style="font-size: 12px;">X (Twitter)</label>
                            <input type="url" id="duzTwitter" value="${sm.twitter || ''}">
                        </div>
                        <div class="form-grup">
                            <label style="font-size: 12px;">YouTube</label>
                            <input type="url" id="duzYoutube" value="${sm.youtube || ''}">
                        </div>
                        <div class="form-grup">
                            <label style="font-size: 12px;">LinkedIn</label>
                            <input type="url" id="duzLinkedin" value="${sm.linkedin || ''}">
                        </div>
                        <div class="form-grup">
                            <label style="font-size: 12px;">TikTok</label>
                            <input type="url" id="duzTiktok" value="${sm.tiktok || ''}">
                        </div>
                        <div class="form-grup">
                            <label style="font-size: 12px;">WhatsApp</label>
                            <input type="tel" id="duzWhatsapp" value="${sm.whatsapp || ''}">
                        </div>
                        <div class="form-grup">
                            <label style="font-size: 12px;">Telegram</label>
                            <input type="url" id="duzTelegram" value="${sm.telegram || ''}">
                        </div>
                    </div>
                </div>
                
                <button class="kaydet-btn" onclick="firmaGuncelle()">
                    <i class="fas fa-save"></i> Kaydet
                </button>
            `;
            
            duzenleIlleriYukle();
        }

        async function duzenleIlleriYukle() {
            const duzIl = document.getElementById('duzIl');
            
            try {
                const snapshot = await db.collection('iller').get();
                
                const iller = [];
                snapshot.forEach(doc => {
                    iller.push(doc.data().ad);
                });
                
                iller.sort();
                
                iller.forEach(il => {
                    const option = document.createElement('option');
                    option.value = il;
                    option.textContent = il;
                    if (il === mevcutFirma.il) {
                        option.selected = true;
                    }
                    duzIl.appendChild(option);
                });
                
                if (mevcutFirma.il) {
                    await duzIlceleriYukle();
                }
            } catch (error) {
                console.error('İl yükleme hatası:', error);
            }
        }

        async function duzIlceleriYukle() {
            const il = document.getElementById('duzIl').value;
            const duzIlce = document.getElementById('duzIlce');
            
            duzIlce.innerHTML = '<option value="">İlçe Yükleniyor...</option>';
            
            if (!il) {
                duzIlce.innerHTML = '<option value="">Önce İl Seçin</option>';
                return;
            }
            
            try {
                const snapshot = await db.collection('ilceler')
                    .where('il', '==', il)
                    .get();
                
                duzIlce.innerHTML = '<option value="">İlçe Seçin (Opsiyonel)</option>';
                
                const ilceler = [];
                snapshot.forEach(doc => {
                    ilceler.push(doc.data().ad);
                });
                
                ilceler.sort();
                
                ilceler.forEach(ilce => {
                    const option = document.createElement('option');
                    option.value = ilce;
                    option.textContent = ilce;
                    if (ilce === mevcutFirma.ilce) {
                        option.selected = true;
                    }
                    duzIlce.appendChild(option);
                });
            } catch (error) {
                console.error('İlçe yükleme hatası:', error);
                duzIlce.innerHTML = '<option value="">İlçe yüklenemedi</option>';
            }
        }

        function duzLogoOnizle(input) {
            const dosya = input.files[0];
            if (dosya) {
                duzLogoDosya = dosya;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const onizleme = document.getElementById('duzLogoOnizleme');
                    onizleme.innerHTML = `<img src="${e.target.result}" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">`;
                };
                reader.readAsDataURL(dosya);
            }
        }

        async function logoSil() {
            if (confirm('Logoyu silmek istediğinize emin misiniz?')) {
                try {
                    await db.collection('firmalar').doc(mevcutFirmaId).update({
                        logo_url: ''
                    });
                    bildirimGoster('Logo silindi.', 'basarili');
                    firmaBilgiYukle();
                } catch (error) {
                    console.error('Logo silme hatası:', error);
                    bildirimGoster('Logo silinirken hata oluştu.', 'hata');
                }
            }
        }

        async function firmaGuncelle() {
            try {
                let logoURL = mevcutFirma.logo_url || '';
                
                if (duzLogoDosya) {
                    try {
                        const formData = new FormData();
                        formData.append('image', duzLogoDosya);
                        formData.append('key', 'e2f110ca9201dd4015ec0ccf0c6dbda1');
                        
                        const response = await fetch('https://api.imgbb.com/1/upload', {
                            method: 'POST',
                            body: formData
                        });
                        
                        const data = await response.json();
                        
                        if (data.success) {
                            logoURL = data.data.url;
                        }
                    } catch (error) {
                        console.error('Logo yükleme hatası:', error);
                    }
                }
                
                await db.collection('firmalar').doc(mevcutFirmaId).update({
                    firma_adi: document.getElementById('duzFirmaAdi').value.trim(),
                    telefon: document.getElementById('duzTelefon').value.trim(),
                    email: document.getElementById('duzEmail').value.trim(),
                    aciklama: document.getElementById('duzAciklama').value.trim(),
                    il: document.getElementById('duzIl').value,
                    ilce: document.getElementById('duzIlce').value,
                    adres: document.getElementById('duzAdres').value.trim(),
                    web_sitesi: document.getElementById('duzWeb').value.trim(),
                    logo_url: logoURL,
                    sosyal_medya: {
                        facebook: document.getElementById('duzFacebook').value.trim(),
                        instagram: document.getElementById('duzInstagram').value.trim(),
                        twitter: document.getElementById('duzTwitter').value.trim(),
                        youtube: document.getElementById('duzYoutube').value.trim(),
                        linkedin: document.getElementById('duzLinkedin').value.trim(),
                        tiktok: document.getElementById('duzTiktok').value.trim(),
                        whatsapp: document.getElementById('duzWhatsapp').value.trim(),
                        telegram: document.getElementById('duzTelegram').value.trim()
                    }
                });
                
                bildirimGoster('Firma bilgileri güncellendi!', 'basarili');
                duzLogoDosya = null;
                firmaBilgiYukle();
            } catch (error) {
                console.error('Güncelleme hatası:', error);
                bildirimGoster('Güncelleme sırasında hata oluştu.', 'hata');
            }
        }

        auth.onAuthStateChanged(async user => {
            if (user) {
                mevcutKullanici = user;
                
                try {
                    const userDoc = await db.collection('kullanicilar').doc(user.uid).get();
                    
                    if (userDoc.exists && userDoc.data().rol === 'admin') {
                        window.location.href = '../admin/index.html';
                    } else {
                        firmaBilgiYukle();
                    }
                } catch (error) {
                    console.error('Rol kontrol hatası:', error);
                    firmaBilgiYukle();
                }
            } else {
                window.location.href = '../firma-giris.html';
            }
        });
    </script>
</body>
</html>
