<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Admin Girişi - e-Firmam</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/Pz11x68W/f-1.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ana-renk: #0f172a;
            --vurgu-renk: #f97316;
            --acik-renk: #f8fafc;
            --beyaz: #ffffff;
            --koyu: #1e293b;
            --gri: #64748b;
            --acik-gri: #e2e8f0;
            --gradient: linear-gradient(135deg, #f97316, #ea580c);
            --kirmizi: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .giris-kart {
            background: var(--beyaz);
            border-radius: 25px;
            padding: 50px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .giris-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .giris-logo img {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            border: 3px solid var(--vurgu-renk);
            margin-bottom: 15px;
        }

        .giris-logo h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--ana-renk);
        }

        .giris-logo h1 span {
            color: var(--vurgu-renk);
        }

        .giris-logo p {
            color: var(--gri);
            font-size: 13px;
            margin-top: 5px;
        }

        .admin-badge {
            display: inline-block;
            background: rgba(239,68,68,0.1);
            color: var(--kirmizi);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .form-grup {
            margin-bottom: 20px;
        }

        .form-grup label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--koyu);
        }

        .input-kutu {
            position: relative;
        }

        .input-kutu i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gri);
            font-size: 16px;
        }

        .input-kutu input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid var(--acik-gri);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-kutu input:focus {
            border-color: var(--vurgu-renk);
        }

        .giris-btn {
            width: 100%;
            background: var(--gradient);
            color: var(--beyaz);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .giris-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(249,115,22,0.4);
        }

        .giris-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bildirim {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .bildirim.hata {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }

        .bildirim.basarili {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            display: block;
        }

        .geri-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--gri);
            text-decoration: none;
            font-size: 14px;
        }

        .geri-link:hover {
            color: var(--vurgu-renk);
        }

        @media (max-width: 480px) {
            .giris-kart {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="giris-kart">
        <div class="giris-logo">
            <img src="https://i.ibb.co/Pz11x68W/f-1.png" alt="e-Firmam Logo">
            <h1>e-<span>Firmam</span></h1>
            <p>Yönetici Paneli</p>
            <span class="admin-badge"><i class="fas fa-shield-alt"></i> Sadece Admin</span>
        </div>

        <div id="bildirim" class="bildirim"></div>

        <div class="form-grup">
            <label>Admin E-posta</label>
            <div class="input-kutu">
                <i class="fas fa-envelope"></i>
                <input type="email" id="adminEmail" placeholder="admin@efirmam.com">
            </div>
        </div>

        <div class="form-grup">
            <label>Şifre</label>
            <div class="input-kutu">
                <i class="fas fa-lock"></i>
                <input type="password" id="adminSifre" placeholder="Şifreniz" onkeypress="enterIleGiris(event)">
            </div>
        </div>

        <button class="giris-btn" id="girisBtn" onclick="adminGiris()">
            <i class="fas fa-shield-alt"></i> Admin Girişi
        </button>

        <a href="index.html" class="geri-link">
            <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
        </a>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjFIiPpycaCru8qh6hbUudVswkr1dkLOI",
            authDomain: "efirmam-45ddf.firebaseapp.com",
            projectId: "efirmam-45ddf",
            storageBucket: "efirmam-45ddf.firebasestorage.app",
            messagingSenderId: "206457982134",
            appId: "1:206457982134:web:a6b244b3f1aae10129aa17",
            measurementId: "G-NCVWRTP072"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function bildirimGoster(mesaj, tip) {
            const bildirim = document.getElementById('bildirim');
            bildirim.textContent = mesaj;
            bildirim.className = 'bildirim ' + tip;
            setTimeout(() => bildirim.className = 'bildirim', 5000);
        }

        function enterIleGiris(event) {
            if (event.key === 'Enter') {
                adminGiris();
            }
        }

        async function adminGiris() {
            const email = document.getElementById('adminEmail').value.trim();
            const sifre = document.getElementById('adminSifre').value;
            const girisBtn = document.getElementById('girisBtn');
            
            if (!email || !sifre) {
                bildirimGoster('Lütfen tüm alanları doldurun.', 'hata');
                return;
            }
            
            girisBtn.disabled = true;
            girisBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Kontrol ediliyor...';
            
            try {
                // Önce Firebase Auth ile giriş yap
                const userCredential = await auth.signInWithEmailAndPassword(email, sifre);
                const user = userCredential.user;
                
                // Sonra Firestore'dan rol kontrol et
                const userDoc = await db.collection('kullanicilar').doc(user.uid).get();
                
                if (userDoc.exists && userDoc.data().rol === 'admin') {
                    bildirimGoster('Admin girişi başarılı! Yönlendiriliyorsunuz...', 'basarili');
                    
                    setTimeout(() => {
                        window.location.href = 'admin/index.html';
                    }, 1000);
                } else {
                    // Admin değilse çıkış yap
                    await auth.signOut();
                    bildirimGoster('Bu hesap admin yetkisine sahip değil!', 'hata');
                    girisBtn.disabled = false;
                    girisBtn.innerHTML = '<i class="fas fa-shield-alt"></i> Admin Girişi';
                }
                
            } catch (error) {
                console.error('Admin giriş hatası:', error);
                
                let hataMesaji = 'Giriş başarısız.';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        hataMesaji = 'Bu e-posta ile kayıtlı kullanıcı bulunamadı.';
                        break;
                    case 'auth/wrong-password':
                        hataMesaji = 'Şifre hatalı.';
                        break;
                    case 'auth/invalid-email':
                        hataMesaji = 'Geçersiz e-posta.';
                        break;
                    default:
                        hataMesaji = 'Hata: ' + error.message;
                }
                
                bildirimGoster(hataMesaji, 'hata');
                girisBtn.disabled = false;
                girisBtn.innerHTML = '<i class="fas fa-shield-alt"></i> Admin Girişi';
            }
        }

        // Zaten admin girişi yapılmışsa admin paneline git
        auth.onAuthStateChanged(async user => {
            if (user) {
                try {
                    const userDoc = await db.collection('kullanicilar').doc(user.uid).get();
                    
                    if (userDoc.exists && userDoc.data().rol === 'admin') {
                        window.location.href = 'admin/index.html';
                    } else {
                        await auth.signOut();
                    }
                } catch (error) {
                    console.error('Kontrol hatası:', error);
                }
            }
        });
    </script>
</body>
</html>
