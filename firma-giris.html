<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Etiketleri -->
    <title>Firma Girişi - e-Firmam</title>
    <meta name="description" content="e-Firmam firma paneli girişi. E-posta veya telefon numaranızla giriş yapın, firmanızı yönetin.">
    <meta name="keywords" content="firma girişi, işletme paneli, e-Firmam giriş">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" content="e-Firmam">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Firma Girişi - e-Firmam">
    <meta property="og:description" content="Firma panelinize giriş yapın.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://efirmam.com/firma-giris.html">
    <meta property="og:site_name" content="e-Firmam">
    <meta property="og:image" content="https://i.ibb.co/Pz11x68W/f-1.png">
    
    <!-- Canonical -->
    <link rel="canonical" href="https://efirmam.com/firma-giris.html">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/Pz11x68W/f-1.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ana-renk: #0f172a;
            --ana-renk-2: #1e293b;
            --vurgu-renk: #f97316;
            --vurgu-renk-2: #ea580c;
            --acik-renk: #f8fafc;
            --beyaz: #ffffff;
            --koyu: #1e293b;
            --gri: #64748b;
            --acik-gri: #e2e8f0;
            --gradient: linear-gradient(135deg, #f97316, #ea580c);
            --yesil: #10b981;
            --kirmizi: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .giris-kart {
            background: var(--beyaz);
            border-radius: 25px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .giris-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .giris-logo img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            border: 3px solid var(--vurgu-renk);
            margin-bottom: 15px;
        }

        .giris-logo h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--ana-renk);
        }

        .giris-logo h1 span {
            color: var(--vurgu-renk);
        }

        .giris-logo p {
            color: var(--gri);
            font-size: 14px;
            margin-top: 5px;
        }

        .form-grup {
            margin-bottom: 20px;
        }

        .form-grup label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--koyu);
        }

        .input-kutu {
            position: relative;
        }

        .input-kutu i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gri);
            font-size: 16px;
        }

        .input-kutu input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid var(--acik-gri);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-kutu input:focus {
            border-color: var(--vurgu-renk);
        }

        .sifre-goster {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gri);
            background: none;
            border: none;
            font-size: 16px;
        }

        .giris-btn {
            width: 100%;
            background: var(--gradient);
            color: var(--beyaz);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .giris-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(249,115,22,0.4);
        }

        .giris-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bildirim {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        .bildirim.hata {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }

        .bildirim.basarili {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            display: block;
        }

        .giris-alt {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--gri);
        }

        .giris-alt a {
            color: var(--vurgu-renk);
            text-decoration: none;
            font-weight: 600;
        }

        .giris-alt a:hover {
            text-decoration: underline;
        }

        .geri-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--gri);
            text-decoration: none;
            font-size: 14px;
        }

        .geri-link:hover {
            color: var(--vurgu-renk);
        }

        @media (max-width: 480px) {
            .giris-kart {
                padding: 30px 20px;
            }

            .giris-logo img {
                width: 60px;
                height: 60px;
            }

            .giris-logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="giris-kart">
        <div class="giris-logo">
            <img src="https://i.ibb.co/Pz11x68W/f-1.png" alt="e-Firmam Logo">
            <h1>e-<span>Firmam</span></h1>
            <p>Firma Paneli Girişi</p>
        </div>

        <div id="bildirim" class="bildirim"></div>

        <div class="form-grup">
            <label>E-posta veya Telefon Numarası</label>
            <div class="input-kutu">
                <i class="fas fa-user"></i>
                <input type="text" id="girisBilgi" placeholder="ornek@firma.com veya 05XX XXX XX XX">
            </div>
        </div>

        <div class="form-grup">
            <label>Şifre</label>
            <div class="input-kutu">
                <i class="fas fa-lock"></i>
                <input type="password" id="girisSifre" placeholder="Şifreniz" onkeypress="enterIleGiris(event)">
                <button class="sifre-goster" onclick="sifreGoster()">
                    <i class="fas fa-eye" id="sifreIcon"></i>
                </button>
            </div>
        </div>

        <button class="giris-btn" id="girisBtn" onclick="firmaGiris()">
            <i class="fas fa-sign-in-alt"></i> Giriş Yap
        </button>

        <div class="giris-alt">
            Hesabınız yok mu? <a href="firma-ekle.html">Firma Ekle</a>
        </div>

        <a href="index.html" class="geri-link">
            <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
        </a>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDjFIiPpycaCru8qh6hbUudVswkr1dkLOI",
            authDomain: "efirmam-45ddf.firebaseapp.com",
            projectId: "efirmam-45ddf",
            storageBucket: "efirmam-45ddf.firebasestorage.app",
            messagingSenderId: "206457982134",
            appId: "1:206457982134:web:a6b244b3f1aae10129aa17",
            measurementId: "G-NCVWRTP072"
        };

        // Firebase Başlat
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Şifre Göster/Gizle
        function sifreGoster() {
            const sifreInput = document.getElementById('girisSifre');
            const sifreIcon = document.getElementById('sifreIcon');
            
            if (sifreInput.type === 'password') {
                sifreInput.type = 'text';
                sifreIcon.classList.remove('fa-eye');
                sifreIcon.classList.add('fa-eye-slash');
            } else {
                sifreInput.type = 'password';
                sifreIcon.classList.remove('fa-eye-slash');
                sifreIcon.classList.add('fa-eye');
            }
        }

        // Bildirim Göster
        function bildirimGoster(mesaj, tip) {
            const bildirim = document.getElementById('bildirim');
            bildirim.textContent = mesaj;
            bildirim.className = 'bildirim ' + tip;
            
            setTimeout(() => {
                bildirim.className = 'bildirim';
            }, 5000);
        }

        // Enter ile Giriş
        function enterIleGiris(event) {
            if (event.key === 'Enter') {
                firmaGiris();
            }
        }

        // Telefonu E-postaya Çevir
        async function telefonIleEpostaBul(telefon) {
            try {
                const snapshot = await db.collection('kullanicilar')
                    .where('telefon', '==', telefon)
                    .limit(1)
                    .get();
                
                if (!snapshot.empty) {
                    return snapshot.docs[0].data().email;
                }
                return null;
            } catch (error) {
                console.error('Telefon arama hatası:', error);
                return null;
            }
        }

        // Firma Girişi
        async function firmaGiris() {
            const girisBilgi = document.getElementById('girisBilgi').value.trim();
            const sifre = document.getElementById('girisSifre').value;
            const girisBtn = document.getElementById('girisBtn');
            
            if (!girisBilgi || !sifre) {
                bildirimGoster('Lütfen tüm alanları doldurun.', 'hata');
                return;
            }
            
            girisBtn.disabled = true;
            girisBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş yapılıyor...';
            
            try {
                let email = girisBilgi;
                
                // Telefon numarası mı girildi?
                if (girisBilgi.startsWith('05') || girisBilgi.startsWith('5')) {
                    // Telefonu düzenle
                    let telefon = girisBilgi.replace(/\s+/g, '');
                    if (!telefon.startsWith('0')) {
                        telefon = '0' + telefon;
                    }
                    
                    const bulunanEmail = await telefonIleEpostaBul(telefon);
                    if (bulunanEmail) {
                        email = bulunanEmail;
                    } else {
                        bildirimGoster('Bu telefon numarasıyla kayıtlı firma bulunamadı.', 'hata');
                        girisBtn.disabled = false;
                        girisBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
                        return;
                    }
                }
                
              // E-posta ile giriş
const userCredential = await auth.signInWithEmailAndPassword(email, sifre);
const user = userCredential.user;

// Kullanıcı rolünü kontrol et
try {
    const userDoc = await db.collection('kullanicilar').doc(user.uid).get();
    
    if (userDoc.exists) {
        const userData = userDoc.data();
        
        bildirimGoster('Giriş başarılı! Yönlendiriliyorsunuz...', 'basarili');
        
        setTimeout(() => {
            if (userData.rol === 'admin') {
                window.location.href = 'admin/index.html';
            } else {
                window.location.href = 'panel/index.html';
            }
        }, 1500);
    } else {
        bildirimGoster('Giriş başarılı! Yönlendiriliyorsunuz...', 'basarili');
        
        setTimeout(() => {
            window.location.href = 'panel/index.html';
        }, 1500);
    }
} catch (rolError) {
    console.error('Rol kontrol hatası:', rolError);
    bildirimGoster('Giriş başarılı! Yönlendiriliyorsunuz...', 'basarili');
    
    setTimeout(() => {
        window.location.href = 'panel/index.html';
    }, 1500);
}
                
            } catch (error) {
                console.error('Giriş hatası:', error);
                
                let hataMesaji = 'Giriş başarısız.';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        hataMesaji = 'Bu bilgilerle kayıtlı firma bulunamadı.';
                        break;
                    case 'auth/wrong-password':
                        hataMesaji = 'Şifre hatalı. Lütfen kontrol edin.';
                        break;
                    case 'auth/invalid-email':
                        hataMesaji = 'Geçersiz e-posta adresi.';
                        break;
                    case 'auth/too-many-requests':
                        hataMesaji = 'Çok fazla giriş denemesi. Lütfen bekleyin.';
                        break;
                    default:
                        hataMesaji = 'Giriş hatası: ' + error.message;
                }
                
                bildirimGoster(hataMesaji, 'hata');
                girisBtn.disabled = false;
                girisBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
            }
        }

       // Zaten giriş yapılmışsa rolüne göre yönlendir
auth.onAuthStateChanged(async user => {
    if (user) {
        try {
            const userDoc = await db.collection('kullanicilar').doc(user.uid).get();
            
            if (userDoc.exists && userDoc.data().rol === 'admin') {
                window.location.href = 'admin/index.html';
            } else {
                window.location.href = 'panel/index.html';
            }
        } catch (error) {
            console.error('Yönlendirme hatası:', error);
            window.location.href = 'panel/index.html';
        }
    }
});
    </script>
</body>
</html>
